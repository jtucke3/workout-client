<div class="card">
  <header>
    <h1>Two-Factor Authentication</h1>
    <p>Enter the 6-digit code from your authenticator app.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <label for="code">Authentication code</label>
      <input
        id="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        formControlName="code"
        placeholder="●●●●●●"
      />
      <div class="error" *ngIf="form.controls.code.invalid && form.controls.code.touched">
        Code must be 6 digits.
      </div>
    </div>

    <button type="submit" class="primary" [disabled]="isLoading()">
      <span *ngIf="!isLoading()">Verify</span>
      <span *ngIf="isLoading()">Verifying…</span>
    </button>

    <button type="button" class="secondary" (click)="backToLogin()">
      Back to login
    </button>

    <div class="error" *ngIf="error()">
      {{ error() }}
    </div>
  </form>
</div>
