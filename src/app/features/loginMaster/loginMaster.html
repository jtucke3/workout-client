<div class="screen">
  <app-login
    *ngIf="step() === 'login'"
    (loginSuccess)="onLoginSuccess()
    "
    (twoFaRequired)="onTwoFaRequired($event)"
  ></app-login>

  <app-two-fa
    *ngIf="step() === '2fa'"
    [challengeId]="challengeId()!"
    [remember]="remember()"
    (verified)="onTwoFaVerified()"
    (backToLogin)="backToLogin()"
  ></app-two-fa>
</div>
