<div class="login-master-shell">
  <ng-container [ngSwitch]="mode()">

    <app-login
      *ngSwitchCase="'login'"
      (loginSuccess)="handleLoginSuccess($event)"
      (twoFaRequired)="handleTwoFaRequired($event)"
    >
    </app-login>

    <app-two-fa-component
      *ngSwitchCase="'twofa-verify'"
      [mode]="'verify'"
      [challengeId]="twoFaChallengeId()"
      (completed)="handleTwoFaVerified()"
      (cancelled)="handleTwoFaVerifyCancelled()"
    >
    </app-two-fa-component>

    <app-two-fa-component
      *ngSwitchCase="'twofa-setup'"
      [mode]="'setup'"
      (completed)="handleTwoFaSetupCompleted()"
      (cancelled)="handleTwoFaSetupCancelled()"
    >
    </app-two-fa-component>

  </ng-container>
</div>
