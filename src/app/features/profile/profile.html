<app-navbar></app-navbar>

<main class="profile-wrapper">
  <div class="profile-card">
    <h1>My Profile</h1>

    <div *ngIf="isLoading()">
      <p>Loading profile...</p>
    </div>

    <div *ngIf="error()" class="error">
      <p>{{ error() }}</p>
    </div>

    <div *ngIf="!isLoading() && profile() as p">
      <div class="profile-field">
        <div class="field-label">Email</div>
        <div class="field-value">{{ p.email || 'Not available' }}</div>
        <button class="blue-btn" (click)="onChangeEmail()">Change</button>
      </div>

      <div class="profile-field">
        <div class="field-label">Username</div>
        <div class="field-value">{{ p.username || 'Not available' }}</div>
        <button class="blue-btn" (click)="onChangeUsername()">Change</button>
      </div>
    </div>
  </div>
</main>
