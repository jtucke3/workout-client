<div class="auth-page">
  <div class="auth-card register-card">
    <h1>Create your account</h1>
    <p class="subtitle">
      Sign up to start tracking your workouts with Redbird.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <div class="field-group">
        <label for="displayName">Display name</label>
        <input id="displayName" type="text" formControlName="displayName" />
        <div
          class="field-error"
          *ngIf="form.get('displayName')?.invalid && form.get('displayName')?.touched"
        >
          Please enter your name.
        </div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" />
          <div
            class="field-error"
            *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
          >
            Please enter a valid email.
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" type="password" formControlName="password" />
          <div
            class="field-error"
            *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
          >
            Password must be at least 8 characters.
          </div>
        </div>
      </div>

      <button type="submit" class="primary" [disabled]="isSubmitting()">
        <span *ngIf="!isSubmitting()">Create account</span>
        <span *ngIf="isSubmitting()">Creating...</span>
      </button>
    </form>

    <p class="error" *ngIf="error()">{{ error() }}</p>
    <p class="success" *ngIf="success()">{{ success() }}</p>

    <p class="footer-text">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
