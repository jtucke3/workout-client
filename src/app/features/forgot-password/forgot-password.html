<main class="forgot-wrapper">
  <div class="forgot-card">
    <div class="card-head">
      <h1>Reset Password</h1>
      <p>Enter your email to receive reset instructions</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Enter a valid email.</small>
      </div>

      <button type="submit" class="blue-btn" [disabled]="form.invalid || isLoading()">
        {{ isLoading() ? 'Sending…' : 'Send reset link' }}
      </button>

      <p *ngIf="message()" class="info">{{ message() }}</p>

      <div class="links">
        <a routerLink="/login">Back to login</a>
      </div>
    </form>
  </div>
</main>
