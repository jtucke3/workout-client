<section class="screen">
  <div class="card">
    <header class="card-head">
      <h1>Reset password</h1>
      <p>Enter your email to receive reset instructions</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <div class="row">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
          <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Enter a valid email.</small>
        </div>
      </div>

      <div class="row cta">
        <button type="submit" [disabled]="form.invalid || isLoading()">{{ isLoading() ? 'Sending…' : 'Send reset link' }}</button>
      </div>

      <p *ngIf="message()" class="info">{{ message() }}</p>

      <div class="links">
        <a routerLink="/login">Back to login</a>
      </div>
    </form>
  </div>
</section>
