<section class="screen">
  <div class="card">
    <header class="card-head">
      <h1>Workout App</h1>
      <p>Log in to track your workouts and progress</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <div class="row">
        <div class="field">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            [class.invalid]="form.get('email')?.invalid && form.get('email')?.touched"
          />
          <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            Enter a valid email.
          </small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.invalid]="form.get('password')?.invalid && form.get('password')?.touched"
          />
          <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
            Min 6 characters.
          </small>
        </div>
      </div>

      <div class="row cta">
        <label class="remember">
          <input type="checkbox" formControlName="remember" />
          <span>Remember me</span>
        </label>

        <button type="submit" [disabled]="form.invalid || isLoading()">
          {{ isLoading() ? 'Logging in…' : 'Log In' }}
        </button>
      </div>

      <p *ngIf="loginError()" class="error">{{ loginError() }}</p>

      <div class="links">
        <a routerLink="/forgot-password">Forgot password?</a>
        <span>•</span>
        <span>Don’t have an account?</span>
        <a routerLink="/register">Sign up</a>
      </div>
    </form>
  </div>
</section>
